name: 每日更新并部署

on:
  schedule:
    # 每天 UTC 22:30 = 北京时间 06:30
    - cron: '30 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并整理论文数据
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_all.py

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci || npm install

      - name: 构建站点
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://wh-liang.github.io' }}
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git commit -m "chore: 更新论文数据 [skip ci]" || true
          git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
